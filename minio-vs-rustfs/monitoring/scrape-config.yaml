# Scrape jobs to add to your Prometheus / VictoriaMetrics agent config
# (scrape_configs). The default 30 s resolution hides a saturation curve, so the
# benchmark namespace gets its own 5 s jobs: the load generator's histograms,
# and a cAdvisor pass filtered down to that namespace (cAdvisor is per node, so
# the filter has to happen after the scrape).
# The scraper's service account needs get on nodes/proxy for the second job.
- job_name: benchmark
  scrape_interval: 5s
  kubernetes_sd_configs:
    - role: pod
      namespaces:
        names: [benchmark]
  relabel_configs:
    - source_labels: [__meta_kubernetes_pod_container_port_name]
      action: keep
      regex: metrics
    - source_labels: [__meta_kubernetes_pod_name]
      target_label: pod
- job_name: cadvisor-benchmark
  scrape_interval: 5s
  scheme: https
  tls_config:
    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    insecure_skip_verify: true
  bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  kubernetes_sd_configs:
    - role: node
  relabel_configs:
    - target_label: __address__
      replacement: kubernetes.default.svc:443
    - source_labels: [__meta_kubernetes_node_name]
      regex: (.+)
      target_label: __metrics_path__
      replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
    - source_labels: [__meta_kubernetes_node_name]
      target_label: node
  metric_relabel_configs:
    - source_labels: [namespace]
      action: keep
      regex: benchmark
