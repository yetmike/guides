# A test pod that mounts the node's Docker socket, so check.sh has something to find.
# On a containerd node the socket does not exist: type File would keep the pod from starting, so the type is left empty.
apiVersion: v1
kind: Pod
metadata:
  name: old-ci-job
spec:
  containers:
    - name: ci
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: docker-sock
          mountPath: /var/run/docker.sock
  volumes:
    - name: docker-sock
      hostPath:
        path: /var/run/docker.sock
